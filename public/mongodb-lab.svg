<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ED64" />
      <stop offset="50%" stop-color="#00684A" />
      <stop offset="100%" stop-color="#023430" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="30" y1="20" x2="98" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13AA52" />
      <stop offset="100%" stop-color="#00ED64" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00ED64" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded dark background container -->
  <rect width="128" height="128" rx="28" fill="#040d0a" stroke="#00ED64" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Ambient green glow -->
  <circle cx="64" cy="64" r="42" fill="#00ED64" fill-opacity="0.08" filter="url(#glow)" />
  
  <!-- Stylized MongoDB Leaf -->
  <g transform="translate(14, 12)">
    <!-- Right leaf lobe -->
    <path
      d="M50 8C50 8 78 30 78 64C78 88 62 101 50 106C50 106 51 90 51 82C51 72 50 68 50 68C50 68 64 64 64 48C64 36 54 22 50 8Z"
      fill="url(#accentGrad)"
    />
    <!-- Left leaf lobe -->
    <path
      d="M50 8C50 8 22 30 22 64C22 88 38 101 50 106C50 106 49 90 49 82C49 72 50 68 50 68C50 68 36 64 36 48C36 36 46 22 50 8Z"
      fill="url(#leafGrad)"
    />
    <!-- Center spine line -->
    <path
      d="M50 12V104"
      stroke="#00ED64"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>
  
  <!-- Small Terminal / Lab Spark dot -->
  <circle cx="94" cy="34" r="4.5" fill="#00ED64" />
</svg>
